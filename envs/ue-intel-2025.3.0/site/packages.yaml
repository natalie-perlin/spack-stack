packages:
    mpi:
      buildable: false
      require:
      - intel-mpi
    intel-compilers:
      buildable: false
      externals:
      - spec: intel-compilers@2025.3.0
        prefix: /pw/apps/intel/2025.3.0
        modules:
        - intel/2025.3.0/tbb/2022.3
        - intel/2025.3.0/compiler-rt/2025.3.0
        - intel/2025.3.0/umf/1.0.2
        - intel/2025.3.0/compiler/2025.3.0
        extra_attributes:
          compilers:
            c: /pw/apps/intel/2025.3.0/compiler/2025.3/bin/icx
            cxx: /pw/apps/intel/2025.3.0/compiler/2025.3/bin/icpx
            fortran: /pw/apps/intel/2025.3.0/compiler/2025.3/bin/ifx
          environment:
            set:
              MODULES_AUTO_HANDLING: '1'
            prepend_path:
              MODULEPATH: /pw/apps/modules
              LD_LIBRARY_PATH: /pw/apps/intel/2025.3.0/compiler/2025.3/lib
              PATH: /pw/apps/intel/2025.3.0/compiler/2025.3/bin
              CPATH: /pw/apps/intel/2025.3.0/compiler/2025.3/include
          extra_rpaths: []
    intel-mpi:
      buildable: false
      externals:
      - spec: intel-mpi@2021.17 +classic-names
        prefix: /pw/apps/intel/2025.3.0
        modules:
        - intel/2025.3.0/mpi/2021.17
    intel-mkl:
      buildable: false
      externals:
      - spec: intel-mkl@2025.3
        prefix: /pw/apps/intel/2025.3.0
        modules:
        - intel/2025.3.0/mkl/2025.3
    intel-tbb:
      buildable: false
      externals:
      - spec: intel-tbb@2022.3
        prefix: /pw/apps/intel/2025.3.0
        modules:
        - intel/2025.3.0/tbb/2022.3
          #
    gcc:
      buildable: false
      externals:
      - spec: gcc@12.4.0 languages:='c,c++,fortran'
        prefix: /apps/spack-2024-12/linux-rocky9-x86_64/gcc-11.4.1/gcc-12.4.0-dsgnou52lpn2tus6mohdmcw5mjqmqrhj
        modules:
        - gcc/12.4.0
        extra_attributes:
          compilers:
            c: /apps/spack-2024-12/linux-rocky9-x86_64/gcc-11.4.1/gcc-12.4.0-dsgnou52lpn2tus6mohdmcw5mjqmqrhj/bin/gcc
            cxx: /apps/spack-2024-12/linux-rocky9-x86_64/gcc-11.4.1/gcc-12.4.0-dsgnou52lpn2tus6mohdmcw5mjqmqrhj/bin/g++
            fortran: /apps/spack-2024-12/linux-rocky9-x86_64/gcc-11.4.1/gcc-12.4.0-dsgnou52lpn2tus6mohdmcw5mjqmqrhj/bin/gfortran
 
    all:
      providers:
        mpi:: [intel-mpi]
        blas:: [intel-mkl]
        fftw-api:: [intel-mkl]
        lapack:: [intel-mkl]
        zlib-api:: [zlib]
    ectrans:
      require::
      - '@1.2.0 ~mkl +fftw'
    gsibec:
      require::
      - '@1.2.1 ~mkl'
    py-numpy:
      require::
      - ^openblas
  # *DH
    bash:
      externals:
      - spec: bash@5.1.8
