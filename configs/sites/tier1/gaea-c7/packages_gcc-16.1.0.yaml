packages:
  all:
    require:
    - any_of: ['gcc@=16.1.0']
      when: '%gcc'
  mpi:
    buildable: False
    require:
      - cray-mpich@9.2.0
  cray-mpich:
    buildable: False
    externals:
    - spec: cray-mpich@9.2.0
      prefix: /sw/gaea-c7/spack/envs/env_26.06/opt/gcc-16.1.0/cray-mpich-9.2.0-kr54iz434fpl24sscwylsegwqd56iahv
      modules:
      - Core/26.06
      - gcc/16.1.0
      - cray-mpich/9.2.0
      - libfabric/2.5.1
  gcc:
    buildable: False
    externals:
    - spec: gcc@16.1.0 languages:='c,c++,fortran'
      prefix: /sw/gaea-c7/gcc/16.1.0/bin
      modules:
        - Core/26.06
        - gcc/16.1.0
      extra_attributes:
        compilers:
          c: /sw/gaea-c7/gcc/16.1.0/bin/gcc
          cxx: /sw/gaea-c7/gcc/16.1.0/bin/g++
          fortran: /sw/gaea-c7/gcc/16.1.0/bin/gfortran
        environment:
          set:
            PE_GCC_EXTERNAL: native
          prepend_path:
            LD_LIBRARY_PATH: "/sw/gaea-c7/gcc/16.1.0/lib64:\
      /sw/gaea-c7/spack/envs/env_26.06/opt/gcc-16.1.0/cray-mpich-9.2.0-kr54iz434fpl24sscwylsegwqd56iahv/lib:\
      /sw/gaea-c7/spack/envs/env_26.06/opt/gcc-11.5.0/libfabric-2.5.1-d5njjykjbsscgk54cifxlrodj7jy77ws/lib"

